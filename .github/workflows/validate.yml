name: Validate scripts and site list

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n oppna-sidorna.sh
      - name: Validate sites and script behavior
        run: python3 tests/test_repo.py
